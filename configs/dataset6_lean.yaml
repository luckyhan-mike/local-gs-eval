# 六路阵列新数据集（datasets_1080，1920x1080，灰墙背景）上的局部 GS 验证，精简流程（同 mofang_9cam_lean.yaml）。
# 用 scripts/run_scenes.py 批量跑 dataset6.shots 里的每组场景：每组单独一个工作目录，最后汇总。
# raw_pattern / aligned_pattern / work_dir 由 run_scenes.py 按场景填写，这里的值只是占位。
# 所有相对路径都相对于 data_root；可用环境变量 LGS_DATA_ROOT 覆盖 data_root。
data_root: /home/han/linux-han          # 对应 Windows 上的 D:\hb，按实际挂载位置修改
work_dir: work                          # 输出目录（相对于本仓库根目录，或写绝对路径）

num_cams: 6
raw_pattern: "datasets/<scene>/<shot>/view_{}.png"        # 2304x1296 原图（AnySplat 输入，未去畸变）
aligned_pattern: "<work>/aligned/aligned_{:02d}.png"     # prepare.py 用标定单应矩阵生成（光流输入/真值）
homographies: datasets_1080/calib/homographies_cam3_raw2304_to_crop1920x1088_halfpx.npy   # 2304 原图上以 cam3 为参考对齐，再中心裁出 1920x1088；6 路一起平移半像素，cam3 也经重采样，锐度一致
aligned_size: [1920, 1088]

