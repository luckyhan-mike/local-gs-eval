rife_dir: Practical-RIFE                # 需包含 train_log/IFNet_HDv3.py 与 train_log/flownet.pkl
anysplat_dir: AnySplat                  # AnySplat 源码根目录
anysplat_ckpt: lhjiang/anysplat         # HF 仓库名或本地目录

# 留一法设置：context 为输入相机，区间内其余相机作为真值目标
setups:
  in035: {context: [0, 3, 5]}           # 输入 0/3/5（间距约 359 / 233 mm），真值 1、2、4

chroma:                                 # 背景墙抠像（OpenCV HSV，H∈[0,180]）：蓝灰色、低饱和的墙面 = 背景
  h_lo: 95                              # 墙面实测 H 99~111、S 31~55、V 86~109
  h_hi: 130
  s_min: 10
  s_max: 110
  v_min: 50
  min_area_frac: 0.002

tokens:                                 # 输入相机上的不可靠区域检测（scripts/detect_tokens.py，不使用真值）
  rife_scale: 1.0
  dis_preset: medium                    # 源图像之间的双向光流（OpenCV DIS）；RIFE 端点 t=0/1 的光流不可用
  fb_thresh: 3.0                        # DIS 前后向不一致阈值（像素）= fb_thresh + fb_rel·|F|
  fb_rel: 0.2
  photo_thresh: 0.08                    # 光度残差（0~1，通道均值）；遮挡需同时满足前后向不一致与光度不一致
  depth_thresh: 2.0                     # RIFE t=0.5 视差的水平梯度（像素/像素），沿 RIFE 对应关系映射回源图像；只取大的深度跳变（魔方 vs 头发），0.5 时脸/衣服轮廓全被标记
  fg_dilate_px: 15                      # 只在前景附近标记
  core_dilate_px: 6                     # token 核心区（贴回区）在原始标记外的膨胀
  recon_margin_px: 48                   # 重建区 = 核心区再外扩，用于保证 GS 在 token 周围也重建准确
  crop_pad_px: 32                       # token 裁剪窗口在重建区外接框外的边距
  paste_feather_px: 8                   # 贴回羽化宽度（落在重建边距内，双方都可靠的区域）
  ring_px: 24                           # 环带配准：在贴回区外这一圈用光流结果做参考（不用真值）
  primary: rife                         # center 等非 token 裁剪的局部高斯用哪个变体
  variants:                             # 每个变体输出 tokens/<setup>/<name>/pair{a}-{b}/（逐对，用于贴回）和并集
    rife:     {use_dis: false, rife_warp: 0.20, rife_col: 6.0,    depth: near_fail, min_cc_px: 150} # 本仓库原 token（对照）
    # 第十四轮：风险图实验第七轮的部署方案 Cn_wide = (A_wide ∩ B) ∪ Fn（VGGT 几何候选 ∩ 三个探测视点上的失败检测，再并上窄的强制项），
    # 不用标定、不用真值；在 Windows 上用 tools/export_cnw_tokens.py 逐对算好（原图坐标），掩码随仓库提交在 data/tokens_cnw/。
    # 这里直接当作失败区：core = 掩码膨胀 core_dilate_px，recon = core 再外扩 recon_margin_px（不再限制在前景附近）
    cnw_cnn:  {external: "data/tokens_cnw/{shot}/cnn"}   # 检测器 = 第七轮重训的 CNN（τ=0.98），主方案
    cnw_f5:   {external: "data/tokens_cnw/{shot}/f5"}    # 检测器 = |W0−W1| 5×5 平滑（τ=0.16），不需训练
  # pair_gate：某相机对的 core 占前景比例（两台相机平均）低于该值时，该对之间的虚拟视点不触发 GS（=纯光流）。
  # 0.03 是初值（第六轮 cam5 oracle_fail 仅占前景 4.2%）；逐目标表会列出每对的 core 面积，便于事后定门限。
  ring_max_disp_px: 20                  # 环带配准位移超过该值视为不可信，退回直接贴回
  paste_fg_dilate_px: 15                # 贴回只在光流结果前景（绿幕抠像）附近进行，不用真值

calib:                                  # 离线阵列标定（第三轮负面结果：单块正对棋盘格下旋转-平移退化，t 误差 0.06；默认不使用）
  board_pattern: "北极星/biao_ding_9/grid_{:02d}.png"      # 同一阵列拍摄的棋盘格原图
  board_inner: [11, 8]                  # 内角点数（12x9 格）
  square_size: 1.0                      # 世界单位 = 1 格
  pair_max_gap: 4                       # 场景匹配只在序号差 <= 4 的相机对之间做
  max_matches_per_pair: 600
  triangulate_max_err_px: 4.0
  per_cam_focal: false                  # 9 台同型号相机共享焦距；单独估计时焦距与深度耦合、散布 3%（不稳定）
  huber_px: 1.5

gs:
  sizes: [448]                          # AnySplat 训练分辨率；上一轮 518 的输入视点自渲染明显退化
  crops: [token]                        # token: 输入相机 token 重建区外接框（第四轮主设置）；center: 中心 1080x1080（整窗口对照）；roi/fg 保留可选
  roi_pad_px: 80                        # ROI 在魔方外接框四周的边距（覆盖手和遮挡带）
  roi_min_side: 448                     # ROI 最小边长（不小于输入分辨率，避免下采样以外的放大）
  roi_window: null                      # 手动指定 [x0, y0, side] 可跳过自动检测
  filter3d_var: 0.2                     # Mip-Splatting 3D 平滑滤波方差系数 s（σ² = s·(d/f)²）
  filter3d_comp: false                  # 3D 滤波的不透明度能量补偿；AnySplat 的扁平高斯会被压成透明（第二轮），默认关闭
  pose_sources: [aligned_int]          # 精简：_alv 用目标图估计位姿，只是对照
  aligned_ref: 3                        # 对齐参考相机（单应矩阵以 cam3 为参考，H_3 = 单位阵）
  aligned_pad_px: 160                   # 对齐域渲染画布四周的余量（平面单应会平移画面）
  local_variants: [rife, cnw_cnn, cnw_f5]   # 第十四轮：每个变体各自编码、各自 TTO（token_window: per_variant）
  multi_window:                         # 第十四轮：按 token 连通块分组、逐窗口编码（窗口小，448 输入几乎不放大）；局部渲染标签 tok<变体>_mw，各窗口渲染合成为一张
    enabled: true
    max_side: 640                       # 合并后的正方形边长不超过该值才合并（单个连通块更大时保留它自己的大窗口）
    max_windows: 4                      # 窗口数上限：超过时强制合并最近的两组
    pad_px: 16                          # 窗口在连通块外接框外的边距
  render_full: false                    # 精简：不渲染整窗口 GS（早期诊断）
  pixgs:                                # 第十五轮：视差空间逐像素高斯（scripts/run_pixgs.py, lgs/pixgs.py）。只为 token 重建区的像素生成高斯，
                                        # 位置 = 像素 + t × 立体对应位移（对齐坐标），颜色取原像素，原分辨率渲染；不用网络、不开窗口、不用标定
    enabled: true
    variants: [cnw_cnn, cnw_f5]         # 立体位移只导出在 Cn_wide 区域附近（tools/export_fs_disp.py --band 72）
    disp: "data/disp_fs/{shot}"         # FoundationStereo（风险图实验 P3 推荐配置 rec_pp）在 Windows 上算好的对齐坐标位移，随仓库提交
    sigma_px: 0.5                       # 每个高斯的半径（像素）；视差变化大处沿 x 拉长，最多 max_stretch_px
    max_stretch_px: 3.0
    eps2d: 0.3                          # gsplat 二维抗锯齿膨胀
    fill_px: 96                         # 某一侧看不到的像素（如 b 中被遮住的墙）沿行取背景侧最近的有效位移，最远 96 px
    depth_tol_px: 3.0                   # 两侧高斯前后差小于 3 px 位移时按 (1-t) / t 混合，否则取更近的一侧
    skip_existing: true                 # 第十六轮：第十五轮的 *_pix 结果已在工作目录里时不重算
    # ---- 第十六轮：修补方法 × 对应来源（标签 <token>_<name>，目录 gs_tok<标签>448_<method>_al_local）----
    run_tokens: [cnw_cnn]               # 第十六轮 a 只用 cnw_cnn（第十五轮主 token），换 token 放到第十六轮 b
    edge_px: 1.0                        # pix2：|dg_x/dx| > 1 px/px（深度边缘）处不沿 x 拉长，裂缝留给另一侧或退回光流
    runs:
      - {name: p3h_fsl,  method: p3h,  disp: "data/disp_fs/{shot}"}    # P3 立体合成（无高斯），FoundationStereo-L（rec_pp）
      - {name: p3h_fss,  method: p3h,  disp: "data/disp_fss/{shot}"}   # 同上，FoundationStereo-S（P3 c_s25_it8）
      - {name: p3h_flw,  method: p3h,  disp: "data/disp_flw/{shot}"}   # 同上，RIFE t=0.5 视点的光流（R1 做法，部署时几乎不花时间）
      - {name: pix2_fsl, method: pix2, disp: "data/disp_fs/{shot}"}    # 逐像素高斯修复版
      - {name: pix2_fss, method: pix2, disp: "data/disp_fss/{shot}"}
      - {name: pix2_flw, method: pix2, disp: "data/disp_flw/{shot}"}
    gate:                               # 不用真值的贴回门控：只在渲染结果与光流结果明显不同处贴（<标签>_g）；光流来源的位移本来就跟光流一致，不做门控
      runs: [p3h_fsl, p3h_fss, pix2_fsl, pix2_fss]
      thr: 0.10                         # 平均 |RGB| 差（0–1），高斯模糊 3 px 后的阈值（0.05 在本机一组场景上只去掉 16–36% 的 core，太松）
      blur_px: 3
      dilate_px: 8
  token_window: per_variant             # 第十四轮：各变体的区域差别大，各用自己的窗口；fixed：所有 token 变体共用一次编码（窗口 = 各变体重建区并集），变体只决定选哪些高斯；per_variant：第六轮做法（每个变体按自己的窗口各编码一次，窗口小时 GS 变差）
  reproject:                            # 第九轮：几何来自 3D、纹理取自输入原图（lgs/reproject.py），与 GS 颜色贴回用同一 token 贴回区
    geometries: []                      # 第九轮负面结果（几何不够准，纹理错位），本轮关闭；[gs, vggt] 可恢复
    sources: [aligned_int]              # 只做可部署的对齐域、光心按 t 插值
    vis_tol: 0.05                       # 输入相机可见性：点深度 ≤ 该相机深度图 ×(1+vis_tol)
    splat_scale: null                   # vggt 点前向投影的分辨率比例；null = 448/窗口边长（点密度约每像素 1 个）
  tto:                                  # 第十轮：局部 GS 测试时优化（lgs/tto.py），以前馈高斯为初值，在输入视点全分辨率裁剪上优化
    checkpoints: [25, 50, 100]          # 第十三轮：收益集中在前 50~100 步，200 步会出漂浮物
    crop:                               # 第十一轮提速：只在可训练高斯投影的外接框（+边距）内渲染与监督，不再渲染整幅输入视图
      enabled: true
      margin_px: 32                     # 外接框四周余量（监督分辨率下的像素）
      per_view: true                    # 第十二轮：每个输入视图用自己的外接框、单独光栅化
      quantile: 0.002                   # 投影点取 0.2%~99.8% 分位，去掉离群高斯
    scope: local                        # local：只优化 token 重建区（各变体并集）的高斯；all：优化窗口内全部高斯
    max_res: 1008                       # 第十四轮改回 1008：第十三轮 1296 时每步慢一倍，质量没有提高；多窗口时窗口本身多在 640 px 以内
    sh_rest: false                      # 只优化 SH 直流项；输入视点少，高阶 SH 容易过拟合视角相关颜色
    ssim_weight: 0.2                    # loss = 0.8·L1 + 0.2·(1−SSIM)
    lr: {means: 1.6e-5, cov: 5.0e-3, opacity: 2.5e-2, dc: 2.5e-3}   # means 再乘输入相机基线长度；第十三轮位置学习率降为 3DGS 默认的 1/10
    max_disp_scale: 1.0                 # 第十三轮：每步后把位置偏移限制在该高斯自身尺寸（前馈协方差迹的平方根）以内，防止漂出监督框成为漂浮物
    max_cov_scale: 1.5                  # 第十三轮：协方差每个方向的缩放限制在 [1/1.5, 1.5] 倍，防止拉成长条
    cov_every: 10                       # 第十四轮：协方差上限每 10 步（及各检查点）才做一次批量 SVD；第十三轮每步做，每步慢了约 25 ms
  keep_mode: visible                    # 局部高斯：visible=输入相机中深度测试后的可见表面；ray=视线穿过即保留（第四轮，足迹过大）
  visible_tol: 0.03                     # 可见性深度容差（相对）
  renders:                              # 每个 (crop, size) 只编码一次；第二、三轮滤波核差异 <0.1 dB，只保留 nat_dil
    - {name: nat_dil,   res: native, mode: classic,     eps2d: auto, filter3d: false}  # 原生分辨率渲染，膨胀按分辨率比例放大

risk:                                   # 光流自身信号 → 风险区域（不使用真值）
  warp_thresh: 0.08                     # |W0-W1| 通道均值阈值（0~1）
  col_thresh: 2.0                       # 双向光流共线残差阈值（像素）
  dilate_px: 9
  fg_dilate_px: 15

eval:
  lean: true                            # 精简：只评参考光流，不做风险阈值扫描、环带配准
  tto_main_variant: cnw_cnn             # 评估报告里 TTO 步数–耗时表用哪个变体
  ref_flow: flow_s1.0_pose              # 用于定义风险区域与混合的参考光流（第二轮起：pose t 在两种基线下都更好）
  fail_err_thresh: 0.08                 # 光流误差 > 该值视为“光流失败”（oracle 区域与 AUC 标签）
  edge_thresh: 0.3                      # 视差水平梯度阈值（像素/像素）
  edge_dilate_px: 5
  feather_sigma: 3.0                    # 混合羽化
  object_dilate_px: 40                  # 物体级区域：真值中最大的高饱和色块（抱枕、水果、书）膨胀 40 px；没有彩色物体的场景该区域为空
  reg_min_px: 2000                      # GS 配准诊断所需的最少前景像素
  sweep_warp: [0.06, 0.08, 0.10, 0.12, 0.15, 0.20, 0.25, 0.30, 0.40]   # 风险阈值扫描（|W0-W1|）
  sweep_col: [2.0, 3.0, 4.0, 6.0, 1.0e+9]                 # 共线残差阈值，1e9 表示不用该信号
  # 第八轮：目标侧光流风险复核。贴回区 = token core ∩ 参考光流在实际 t 下的风险区（|W0-W1| > warp 或共线残差 > col，
  # 外扩 dilate_px，限制在光流结果抠像前景附近；不用真值）。每项生成 hyb_tokchk_<name>[v]，另附 oracle（core ∩ 真值失败区）作上限。
  # 第八轮结论：w06~w20 与不复核几乎相同（光流风险区本来就覆盖 token core），本轮只保留 w20 与 oracle。
  target_check_suffix: [_al_local, _al_tto25_local, _al_tto50_local, _al_tto100_local]   # 前馈与各 TTO 检查点的 oracle 上限
  target_check: []                      # 精简：第八轮 w20 与不复核几乎相同；[] = 只做 oracle
